spring.application.name=mfa
app.domain.localhost = localhost

# Connect to database
spring.datasource.url=jdbc:mysql://localhost:3306/informationsecurity?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Config hibernate
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto = update

# HikariCP tuning
# maxPoolSize_per_instance = floor((DB_max_connections - reserved_connections) / number_of_app_instances)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.validation-timeout=5000

logging.level.com.zaxxer.hikari=DEBUG

# Api version
server.servlet.context-path=/api/v1

# Swagger
springdoc.swagger-ui.path=/swagger-ui/index.html

